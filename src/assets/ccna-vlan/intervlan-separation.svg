<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Same VLAN switching and inter-VLAN routing</title>
  <desc id="description">Two sales hosts communicate through a switch in VLAN 10. A technical host in VLAN 20 requires a Layer 3 gateway to communicate with them.</desc>
  <rect width="960" height="420" rx="24" fill="#f7f9fe"/>
  <text x="480" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#122447">VLANs separate Layer 2 broadcast domains</text>
  <rect x="44" y="91" width="872" height="275" rx="20" fill="#fff" stroke="#d8e2f1" stroke-width="2"/>
  <rect x="67" y="121" width="510" height="214" rx="18" fill="#eff5ff" stroke="#8fb5f4" stroke-width="2"/>
  <text x="322" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2458b8">VLAN 10 · SALES · 192.168.10.0/24</text>
  <rect x="98" y="190" width="140" height="76" rx="12" fill="#fff" stroke="#8fb5f4" stroke-width="2"/>
  <text x="168" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17356d">Host A</text>
  <text x="168" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526584">192.168.10.11</text>
  <rect x="403" y="190" width="140" height="76" rx="12" fill="#fff" stroke="#8fb5f4" stroke-width="2"/>
  <text x="473" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17356d">Host B</text>
  <text x="473" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526584">192.168.10.12</text>
  <path d="M240 228h158" fill="none" stroke="#2c66cf" stroke-width="5"/>
  <path d="m386 218 14 10-14 10" fill="none" stroke="#2c66cf" stroke-width="5"/>
  <text x="320" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2458b8">Layer 2 switching</text>
  <rect x="622" y="121" width="270" height="214" rx="18" fill="#fff5ed" stroke="#f0b17f" stroke-width="2"/>
  <text x="757" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a34c16">VLAN 20 · TECH</text>
  <rect x="685" y="190" width="145" height="76" rx="12" fill="#fff" stroke="#f0b17f" stroke-width="2"/>
  <text x="757" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#78390f">Host C</text>
  <text x="757" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#765b4c">192.168.20.11</text>
  <path d="M578 228h91" fill="none" stroke="#bd6730" stroke-width="4" stroke-dasharray="9 8"/>
  <circle cx="623" cy="228" r="23" fill="#fff" stroke="#bd6730" stroke-width="3"/>
  <text x="623" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#a34c16">L3</text>
  <text x="480" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526584">Traffic between VLAN 10 and VLAN 20 must pass through a Layer 3 gateway.</text>
</svg>
