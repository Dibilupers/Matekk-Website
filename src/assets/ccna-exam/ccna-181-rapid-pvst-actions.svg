<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Rapid PVST+ forwarding state actions matching exercise</title>
  <desc id="desc">Six switch-port behaviors on the left and four blank action targets on the right.</desc>
  <rect width="1200" height="570" rx="20" fill="#f8fafc"/>
  <text x="60" y="58" fill="#1e293b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Match each behavior to an action</text>
  <g font-family="Arial,sans-serif" font-size="21" fill="#24354a">
    <rect x="52" y="84" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="121">Frames received from the attached segment are discarded</text>
    <rect x="52" y="157" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="194">BPDUs received are forwarded to the system module</text>
    <rect x="52" y="230" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="256"><tspan x="76">The port in the forwarding state responds to</tspan><tspan x="76" dy="24">network management messages</tspan></text>
    <rect x="52" y="303" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="329"><tspan x="76">BPDUs received from the system module are</tspan><tspan x="76" dy="24">processed and transmitted</tspan></text>
    <rect x="52" y="376" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="413">Switched frames received from other ports are advanced</text>
    <rect x="52" y="449" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="76" y="486">Frames received from the attached segment are processed</text>
  </g>
  <g fill="#f9dada" stroke="#e8b4b4" stroke-width="2">
    <rect x="746" y="84" width="400" height="62" rx="10"/><rect x="746" y="157" width="400" height="62" rx="10"/>
    <rect x="746" y="230" width="400" height="62" rx="10"/><rect x="746" y="303" width="400" height="62" rx="10"/>
  </g>
  <text x="746" y="544" fill="#64748b" font-family="Arial,sans-serif" font-size="17">Not all actions are used.</text>
</svg>
