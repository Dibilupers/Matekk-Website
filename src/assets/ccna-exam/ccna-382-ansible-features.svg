<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Ansible features matching exercise</title>
  <desc id="desc">Six statements about Ansible on the left and four blank feature targets on the right.</desc>
  <rect width="1200" height="570" rx="20" fill="#f8fafc"/>
  <text x="60" y="58" fill="#1e293b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Match each statement to an Ansible feature</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#24354a">
    <rect x="52" y="84" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="122">Uses the YAML language</text>
    <rect x="52" y="157" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="195">Executes modules via SSH by default</text>
    <rect x="52" y="230" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="268">Pushes configurations to the client</text>
    <rect x="52" y="303" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="341">Uses agents to manage hosts</text>
    <rect x="52" y="376" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="414">Requires clients to pull configurations from the server</text>
    <rect x="52" y="449" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/>
    <text x="78" y="487">Operates without agents</text>
  </g>
  <g fill="#f9dada" stroke="#e8b4b4" stroke-width="2">
    <rect x="746" y="84" width="400" height="62" rx="10"/><rect x="746" y="157" width="400" height="62" rx="10"/>
    <rect x="746" y="230" width="400" height="62" rx="10"/><rect x="746" y="303" width="400" height="62" rx="10"/>
  </g>
  <text x="746" y="544" fill="#64748b" font-family="Arial,sans-serif" font-size="17">Not all features are used.</text>
</svg>
