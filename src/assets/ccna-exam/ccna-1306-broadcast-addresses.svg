<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Broadcast IP address matching exercise</title>
  <desc id="desc">Six IP addresses with four blank targets in the Broadcast Address column.</desc>
  <rect width="1200" height="570" rx="20" fill="#f8fafc"/>
  <text x="60" y="58" fill="#1e293b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Classify each IP address</text>
  <text x="746" y="58" fill="#344256" font-family="Arial,sans-serif" font-size="22" font-weight="700">Broadcast Address</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#24354a">
    <rect x="52" y="84" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="123" text-anchor="middle">10.1.255.254/24</text>
    <rect x="52" y="157" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="196" text-anchor="middle">10.63.255.255/10</text>
    <rect x="52" y="230" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="269" text-anchor="middle">172.16.255.39/29</text>
    <rect x="52" y="303" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="342" text-anchor="middle">172.20.255.255/16</text>
    <rect x="52" y="376" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="415" text-anchor="middle">192.168.1.10/24</text>
    <rect x="52" y="449" width="660" height="62" rx="10" fill="#d9efff" stroke="#9fc7df" stroke-width="2"/><text x="382" y="488" text-anchor="middle">192.168.255.127/25</text>
  </g>
  <g fill="#f9dada" stroke="#e8b4b4" stroke-width="2">
    <rect x="746" y="84" width="400" height="62" rx="10"/><rect x="746" y="157" width="400" height="62" rx="10"/>
    <rect x="746" y="230" width="400" height="62" rx="10"/><rect x="746" y="303" width="400" height="62" rx="10"/>
  </g>
  <text x="746" y="544" fill="#64748b" font-family="Arial,sans-serif" font-size="17">Not all options are used.</text>
</svg>
