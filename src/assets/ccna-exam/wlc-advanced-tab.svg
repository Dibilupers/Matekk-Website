<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Wireless LAN advanced settings</title>
  <desc id="desc">Advanced wireless LAN controller settings, including session timeout, client limits, DHCP, management frame protection, and DTIM period.</desc>
  <rect width="1200" height="780" rx="18" fill="#f7f8fa"/>
  <rect x="18" y="18" width="1164" height="744" rx="12" fill="#fff" stroke="#334155" stroke-width="4"/>
  <rect x="22" y="22" width="1156" height="58" fill="#e4e9ef"/>
  <rect x="570" y="25" width="130" height="48" rx="5" fill="#d0dce8"/>
  <g font-family="Arial,sans-serif" font-size="21" fill="#405168">
    <text x="54" y="59">General</text><text x="168" y="59">Security</text><text x="296" y="59">QoS</text>
    <text x="390" y="59">Policy-Mapping</text><text x="594" y="59" font-weight="700">Advanced</text>
  </g>
  <rect x="44" y="100" width="1112" height="624" rx="12" fill="#f0f2f5" stroke="#cbd3dd" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="19" fill="#35465c">
    <text x="81" y="150">Allow AAA Override</text><text x="81" y="198">Coverage Hole Detection</text>
    <text x="81" y="246">Enable Session Timeout</text><text x="81" y="294">Aironet IE</text>
    <text x="81" y="342">Diagnostic Channel</text><text x="81" y="390">Layer2 ACL</text>
    <text x="81" y="438">P2P Blocking Action</text><text x="81" y="486">Client Exclusion</text>
    <text x="81" y="534">Maximum Allowed Clients</text><text x="81" y="582">Static IP Tunneling</text>
    <text x="81" y="630">Maximum Allowed Clients Per AP Radio</text><text x="81" y="678">Session Timeout (secs)</text>
  </g>
  <g fill="#fff" stroke="#9ba8b8" stroke-width="2">
    <rect x="386" y="130" width="20" height="20" rx="3"/><rect x="386" y="178" width="20" height="20" rx="3"/>
    <rect x="386" y="226" width="20" height="20" rx="3"/><rect x="386" y="274" width="20" height="20" rx="3"/>
    <rect x="386" y="322" width="20" height="20" rx="3"/><rect x="386" y="466" width="20" height="20" rx="3"/>
    <rect x="386" y="562" width="20" height="20" rx="3"/>
    <rect x="460" y="226" width="125" height="30" rx="4"/><rect x="460" y="370" width="132" height="32" rx="4"/>
    <rect x="460" y="418" width="165" height="32" rx="4"/><rect x="460" y="514" width="80" height="32" rx="4"/>
    <rect x="460" y="610" width="132" height="32" rx="4"/><rect x="460" y="658" width="150" height="32" rx="4"/>
    <rect x="720" y="132" width="20" height="20" rx="3"/><rect x="720" y="180" width="20" height="20" rx="3"/>
    <rect x="720" y="228" width="20" height="20" rx="3"/><rect x="720" y="276" width="20" height="20" rx="3"/>
    <rect x="720" y="324" width="20" height="20" rx="3"/><rect x="720" y="372" width="20" height="20" rx="3"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#47566a">
    <text x="419" y="149">Enabled</text><text x="419" y="197">Enabled</text><text x="459" y="245">3600</text>
    <text x="419" y="293">Enabled</text><text x="419" y="341">Enabled</text><text x="459" y="391">None</text>
    <text x="459" y="439">Disabled</text><text x="459" y="535">10</text><text x="459" y="631">10</text>
    <text x="459" y="679">3600</text>
    <text x="758" y="149">DHCP Server Override</text><text x="758" y="197">DHCP Addr. Assignment Required</text>
    <text x="758" y="245">Split Tunnel Enabled</text><text x="758" y="293">Management Frame Protection</text>
    <text x="758" y="341">MFP Client Protection</text><text x="758" y="389">DTIM Period</text>
  </g>
  <text x="760" y="449" fill="#35465c" font-family="Arial,sans-serif" font-size="18">802.11a/n (1–255)</text>
  <rect x="966" y="426" width="115" height="32" rx="4" fill="#fff" stroke="#9ba8b8" stroke-width="2"/>
  <text x="760" y="493" fill="#35465c" font-family="Arial,sans-serif" font-size="18">802.11b/g/n (1–255)</text>
