<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">VTP pruning example for VLAN 10</title>
  <desc id="description">PC A sends a VLAN 10 broadcast to a server switch. The server forwards the needed VLAN 10 traffic to Switch 3, which has an active VLAN 10 port. Switch 2 has no VLAN 10 ports, so VLAN 10 flooded traffic is pruned on that trunk. Switch 3 advertises its active VLAN 10 port need.</desc>
  <rect width="960" height="470" rx="24" fill="#f7f9fe"/>
  <text x="480" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#122447">VTP pruning · do not flood VLANs where they are not needed</text>
  <rect x="59" y="154" width="160" height="89" rx="16" fill="#eef4ff" stroke="#8fb5f4" stroke-width="2"/>
  <text x="139" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2458b8">PC A</text>
  <text x="139" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526584">VLAN 10 broadcast</text>
  <rect x="337" y="130" width="205" height="137" rx="18" fill="#13294b"/>
  <text x="439" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">VTP SERVER</text>
  <text x="439" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ccdcf7">Receives VLAN 10 frame</text>
  <text x="439" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ccdcf7">and VLAN-need ads</text>
  <rect x="701" y="94" width="195" height="112" rx="17" fill="#fff" stroke="#d3dae6" stroke-width="2"/>
  <text x="798" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#526584">SWITCH 2</text>
  <text x="798" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#71819b">No active VLAN 10 ports</text>
  <rect x="701" y="281" width="195" height="112" rx="17" fill="#eef4ff" stroke="#8fb5f4" stroke-width="2"/>
  <text x="798" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2458b8">SWITCH 3</text>
  <text x="798" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526584">Active VLAN 10 port</text>
  <path d="M219 199H337" stroke="#2c66cf" stroke-width="6"/>
  <path d="m323 189 14 10-14 10" fill="none" stroke="#2c66cf" stroke-width="4"/>
  <text x="278" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2458b8">VLAN 10</text>
  <path d="M542 165 701 141" stroke="#c85454" stroke-width="6" stroke-dasharray="11 8"/>
  <circle cx="623" cy="153" r="19" fill="#fff" stroke="#c85454" stroke-width="3"/>
  <path d="m615 145 16 16m0-16-16 16" stroke="#c85454" stroke-width="4"/>
  <text x="620" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ad3c3c">VLAN 10 pruned</text>
  <path d="M542 232 701 327" stroke="#2c66cf" stroke-width="6"/>
  <path d="m684 310 17 17-23 1" fill="none" stroke="#2c66cf" stroke-width="4"/>
  <text x="623" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2458b8">VLAN 10 traffic forwarded</text>
  <path d="M701 370 542 260" stroke="#cf9a2b" stroke-width="4" stroke-dasharray="7 6"/>
  <text x="625" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#91610d">VLAN-need advertisement</text>
  <rect x="133" y="420" width="694" height="34" rx="11" fill="#fff8eb"/>
  <text x="480" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#765b4c">Pruning suppresses eligible flooded traffic per VLAN; it does not delete the VLAN or shut down the trunk.</text>
</svg>
