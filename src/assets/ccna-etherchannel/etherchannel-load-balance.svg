<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title description">
  <title id="title">EtherChannel distributes flows and survives a member link failure</title>
  <desc id="description">Detailed switch chassis connect through a three-member Port-Channel. Three independently hashed traffic flows use different members. One failed member is marked, while two remaining links carry redistributed flows and the logical Port-Channel stays up.</desc>
  <defs>
    <g id="switch">
      <rect x="0" y="0" width="180" height="125" rx="14" fill="#152b4c"/>
      <rect x="11" y="11" width="158" height="17" rx="5" fill="#263e63"/>
      <circle cx="23" cy="19.5" r="3.5" fill="#5be0a0"/><circle cx="37" cy="19.5" r="3.5" fill="#71a7ff"/>
      <text x="102" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#eaf2ff">SWITCH · MEMBER PORTS</text>
      <rect x="14" y="42" width="152" height="64" rx="8" fill="#0c1b32" stroke="#3c587e"/>
      <g fill="#9ab3d9">
        <rect x="24" y="52" width="18" height="13" rx="2"/><rect x="48" y="52" width="18" height="13" rx="2"/><rect x="72" y="52" width="18" height="13" rx="2"/><rect x="96" y="52" width="18" height="13" rx="2"/><rect x="120" y="52" width="18" height="13" rx="2"/><rect x="144" y="52" width="13" height="13" rx="2"/>
        <rect x="24" y="77" width="18" height="13" rx="2"/><rect x="48" y="77" width="18" height="13" rx="2"/><rect x="72" y="77" width="18" height="13" rx="2"/><rect x="96" y="77" width="18" height="13" rx="2"/><rect x="120" y="77" width="18" height="13" rx="2"/><rect x="144" y="77" width="13" height="13" rx="2"/>
      </g>
      <text x="33" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b9cce8">Gi0/1</text>
      <text x="57" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b9cce8">Gi0/2</text>
      <text x="81" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b9cce8">Gi0/3</text>
    </g>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#2871d5"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#26926d"/></marker>
  </defs>
  <rect width="1100" height="510" rx="26" fill="#f6f8fd"/>
  <text x="550" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#13294b">EtherChannel · load sharing and member failover</text>
  <g transform="translate(70 152)"><use href="#switch"/></g>
  <g transform="translate(850 152)"><use href="#switch"/></g>
  <text x="160" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17356d">SWITCH A</text>
  <text x="940" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17356d">SWITCH B</text>
  <path d="M250 197C400 165 700 165 850 197" fill="none" stroke="#2871d5" stroke-width="8"/>
  <path d="M250 215C420 215 680 215 850 215" fill="none" stroke="#26926d" stroke-width="8"/>
  <path d="M250 233C400 265 700 265 850 233" fill="none" stroke="#9061cf" stroke-width="8"/>
  <rect x="428" y="124" width="244" height="34" rx="10" fill="#e9f2ff" stroke="#a9c6f4"/>
  <text x="550" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2458b8">Port-Channel 1 · 3 active members</text>
  <circle cx="355" cy="185" r="14" fill="#fff" stroke="#2871d5" stroke-width="3"/><text x="355" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2871d5">1</text>
  <circle cx="550" cy="215" r="14" fill="#fff" stroke="#26926d" stroke-width="3"/><text x="550" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#26926d">2</text>
  <circle cx="745" cy="251" r="14" fill="#fff" stroke="#9061cf" stroke-width="3"/><text x="745" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#9061cf">3</text>
  <rect x="90" y="309" width="920" height="65" rx="15" fill="#fff" stroke="#d8e2f1" stroke-width="2"/>
  <text x="550" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17356d">Traffic hash selects a member for each flow</text>
  <text x="550" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526584">Flow 1 → Gi0/1 · Flow 2 → Gi0/2 · Flow 3 → Gi0/3 (example only; hash results vary)</text>
  <path d="M330 420H850" stroke="#2871d5" stroke-width="8"/>
  <path d="M330 447H850" stroke="#26926d" stroke-width="8"/>
  <path d="M330 474H850" stroke="#c85454" stroke-width="7" stroke-dasharray="10 8"/>
  <circle cx="580" cy="474" r="16" fill="#fff" stroke="#c85454" stroke-width="3"/>
  <path d="m573 467 14 14m0-14-14 14" stroke="#c85454" stroke-width="4"/>
  <rect x="82" y="408" width="216" height="82" rx="14" fill="#e9f7f0" stroke="#8dc9aa" stroke-width="2"/>
  <text x="190" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#23764f">ONE MEMBER FAILS</text>
  <text x="190" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#426b58">Port-Channel stays up</text>
  <rect x="862" y="408" width="156" height="82" rx="14" fill="#e9f2ff" stroke="#a9c6f4" stroke-width="2"/>
  <text x="940" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2458b8">2 MEMBERS LEFT</text>
  <text x="940" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526584">Reduced capacity</text>
</svg>
