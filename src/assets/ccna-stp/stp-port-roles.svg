  <text x="560" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2458b8">Root port</text>
  <rect x="388" y="266" width="100" height="31" rx="9" fill="#eaf2ff"/>
  <text x="438" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2458b8">Root port</text>
